<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="De viswinkel van Schaap's Vishandel aan de Herenstraat 48 in Leiden">
  <rect width="1200" height="900" fill="#14194f"/>
  <rect x="150" y="220" width="900" height="560" fill="#1d2472"/>
  <!-- awning -->
  <path d="M120 360 H1080 V300 H120 Z" fill="#14194f"/>
  <path d="M120 360 H1080 L1020 440 H180 Z" fill="#c0392b"/>
  <g fill="#f7fbfe" opacity="0.9">
    <path d="M180 360 H300 L276 440 H204 Z"/>
    <path d="M420 360 H540 L516 440 H444 Z"/>
    <path d="M660 360 H780 L756 440 H684 Z"/>
    <path d="M900 360 H1020 L996 440 H924 Z"/>
  </g>
  <!-- sign -->
  <rect x="150" y="220" width="900" height="90" fill="#0e1338"/>
  <text x="600" y="283" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#b8832e">SCHAAP'S VIS</text>
  <!-- window + door -->
  <rect x="220" y="500" width="430" height="280" fill="#a8d8f0" opacity="0.85"/>
  <rect x="700" y="500" width="280" height="280" fill="#0e1338"/>
  <rect x="700" y="500" width="280" height="280" fill="none" stroke="#b8832e" stroke-width="6"/>
  <g stroke="#1d2472" stroke-width="6" opacity="0.5">
    <path d="M435 500 V780"/><path d="M220 640 H650"/>
  </g>
  <text x="840" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#b8832e">VIS</text>
  <text x="600" y="850" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f7fbfe" opacity="0.7">Herenstraat 48 · Leiden · sinds 1938</text>
</svg>
