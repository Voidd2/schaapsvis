name: Build site

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "messages/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "vite.config.*"
      - "cloudflare.config.*"
      - "wrangler.*"
      - "workers/**"
      - "tsconfig.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "scripts/check-content-integrity.mjs"
      - ".github/workflows/build-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "messages/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "vite.config.*"
      - "cloudflare.config.*"
      - "wrangler.*"
      - "workers/**"
      - "tsconfig.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "scripts/check-content-integrity.mjs"
      - ".github/workflows/build-validation.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run build
      - run: npm run build:cloudflare
