name: Build site

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "messages/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "scripts/check-content-integrity.mjs"
      - ".github/workflows/build-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "messages/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "scripts/check-content-integrity.mjs"
      - ".github/workflows/build-validation.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run check:content
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-package-lock
          path: package-lock.json
          retention-days: 1
