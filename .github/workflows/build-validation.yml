name: Build site

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "messages/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "vite.config.*"
      - "cloudflare.config.*"
      - "wrangler.*"
      - "workers/**"
      - "scripts/build.mjs"
      - "scripts/check-build-target.mjs"
      - "scripts/build-static-images.mjs"
      - "tsconfig.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "scripts/check-content-integrity.mjs"
      - "scripts/check-shop-navigation.mjs"
      - "scripts/check-pass-qr.mjs"
      - ".github/workflows/build-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "messages/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "vite.config.*"
      - "cloudflare.config.*"
      - "wrangler.*"
      - "workers/**"
      - "scripts/build.mjs"
      - "scripts/check-build-target.mjs"
      - "scripts/build-static-images.mjs"
      - "tsconfig.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "scripts/check-content-integrity.mjs"
      - "scripts/check-shop-navigation.mjs"
      - "scripts/check-pass-qr.mjs"
      - ".github/workflows/build-validation.yml"

permissions:
  contents: read

jobs:
  locked-site:
    name: Production and preview access
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-live-access.mjs ${{ github.event_name == 'pull_request' && '--previews-only' || '' }}
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: node scripts/check-shop-navigation.mjs
      - run: node scripts/check-pass-qr.mjs
      - run: node scripts/check-build-target.mjs
      - run: node scripts/build-static-images.mjs --check
      - run: npm run build
      - run: npm run build:cloudflare

