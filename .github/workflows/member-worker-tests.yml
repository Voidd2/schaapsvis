name: Member worker tests

on:
  pull_request:
    paths:
      - "workers/members/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/member-worker-tests.yml"
  push:
    branches:
      - main
    paths:
      - "workers/members/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/member-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: member-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Worker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run worker integration tests
        run: npm run check:members
